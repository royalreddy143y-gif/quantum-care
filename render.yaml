services:
  # Single Unified Full-Stack Service (React Frontend + FastAPI Backend)
  - type: web
    name: quantumcare
    runtime: python
    plan: free
    region: oregon
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: MODEL_MODE
        value: demo
      - key: SECRET_KEY
        generateValue: true
