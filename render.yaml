services:
  # ============================================================================
  # 1. QuantumCare Backend API Service (Python FastAPI)
  # ============================================================================
  - type: web
    name: quantumcare-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "python run.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: MODEL_MODE
        value: demo
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: 1
      - key: MALLOC_ARENA_MAX
        value: 2
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGODB_DB_NAME
        value: "quantumcare"
      - key: MONGODB_URI
        sync: false

  # ============================================================================
  # 2. QuantumCare Frontend Web App (React + Vite Static Site)
  # ============================================================================
  - type: static
    name: quantumcare-frontend
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://quantumcare-backend.onrender.com/api"
