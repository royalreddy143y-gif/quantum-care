services:
  # Backend FastAPI Web Service
  - type: web
    name: quantumcare-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: MODEL_MODE
        value: demo
      - key: SECRET_KEY
        generateValue: true
      - key: API_V1_STR
        value: /api

  # Frontend React Static Site
  - type: web
    name: quantumcare-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: quantumcare-backend
          property: url
          path: /api
