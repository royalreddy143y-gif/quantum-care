services:
  # Single Unified Full-Stack Service (React Frontend + FastAPI Backend)
  - type: web
    name: quantumcare
    runtime: python
    plan: free
    region: oregon
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: MODEL_MODE
        value: demo
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
